<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#030712">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Todo Glass • Android</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --glass-surface: rgba(255, 255, 255, 0.04);
      --glass-card: rgba(255, 255, 255, 0.06);
      --glass-card-hover: rgba(255, 255, 255, 0.09);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-highlight: rgba(255, 255, 255, 0.22);
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.35);
      --accent: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.35);
      --priority-high: #f43f5e;
      --priority-med: #fbbf24;
      --priority-low: #34d399;
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
    }

    .light-theme {
      --bg: #e2e8f0;
      --glass-surface: rgba(255, 255, 255, 0.65);
      --glass-card: rgba(255, 255, 255, 0.75);
      --glass-card-hover: rgba(255, 255, 255, 0.9);
      --glass-border: rgba(255, 255, 255, 0.5);
      --glass-highlight: rgba(255, 255, 255, 0.8);
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-glow: rgba(2, 132, 199, 0.25);
      --accent: #7c3aed;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    /* AMBIENT GLOWING LIQUID ORBS */
    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
      animation: floatOrb 16s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #38bdf8 0%, rgba(56,189,248,0) 70%);
      top: -60px;
      left: -60px;
    }

    .orb-2 {
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, #a855f7 0%, rgba(168,85,247,0) 70%);
      bottom: 40px;
      right: -80px;
      animation-duration: 20s;
    }

    .orb-3 {
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, #06b6d4 0%, rgba(6,182,212,0) 70%);
      top: 40%;
      left: 30%;
      animation-duration: 14s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, 40px) scale(1.1); }
      100% { transform: translate(-20px, 20px) scale(0.95); }
    }

    /* MAIN CONTAINER (GLASS APP SHELL) */
    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 10;
      padding-bottom: 100px;
    }

    /* HEADER */
    header {
      padding: 24px 20px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(20px) saturate(190%);
      -webkit-backdrop-filter: blur(20px) saturate(190%);
      background: var(--glass-surface);
      border-bottom: 1px solid var(--glass-border);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.15);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-title-group h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, #ffffff 30%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .light-theme .app-title-group h1 {
      background: linear-gradient(135deg, #0f172a 30%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .app-title-group p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
      font-weight: 500;
    }

    .glass-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: inset 0 1px 1px var(--glass-highlight);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-btn:active {
      transform: scale(0.92);
      background: var(--glass-card-hover);
    }

    /* PROGRESS GLASS CARD */
    .glass-progress {
      background: var(--glass-card);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25), inset 0 1px 1px var(--glass-highlight);
    }

    .progress-info h2 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .progress-info p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      margin-top: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 999px;
      width: 0%;
      box-shadow: 0 0 12px var(--primary-glow);
      transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .progress-percent {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      margin-left: 16px;
      font-family: 'Space Grotesk', sans-serif;
      text-shadow: 0 0 20px var(--primary-glow);
    }

    /* SEARCH BAR */
    .search-box {
      margin: 16px 20px 8px 20px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: var(--glass-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 14px;
      outline: none;
      box-shadow: inset 0 1px 1px var(--glass-highlight);
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 16px var(--primary-glow), inset 0 1px 1px var(--glass-highlight);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    /* FILTER PILLS (FROSTED GLASS) */
    .filter-scroll {
      display: flex;
      gap: 8px;
      padding: 8px 20px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filter-scroll::-webkit-scrollbar {
      display: none;
    }

    .pill {
      padding: 7px 15px;
      border-radius: 20px;
      background: var(--glass-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      box-shadow: inset 0 1px 1px var(--glass-highlight);
      transition: all 0.2s ease;
    }

    .pill.active {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #030712;
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    /* TASK LIST */
    .task-list {
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--text-muted);
      text-align: center;
    }

    .empty-icon {
      font-size: 52px;
      margin-bottom: 12px;
      opacity: 0.7;
      filter: drop-shadow(0 0 16px var(--primary-glow));
    }

    /* TASK CARD (GLASSMORPHIC) */
    .task-card {
      background: var(--glass-card);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18), inset 0 1px 1px var(--glass-highlight);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .task-card:active {
      transform: scale(0.98);
      background: var(--glass-card-hover);
    }

    .task-card.completed {
      opacity: 0.5;
      filter: grayscale(0.5);
    }

    .custom-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 8px;
      border: 1.5px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
      box-shadow: inset 0 1px 1px var(--glass-highlight);
      transition: all 0.2s ease;
    }

    .task-card.completed .custom-checkbox {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 12px var(--primary-glow);
    }

    .checkmark {
      display: none;
      color: #030712;
      font-size: 13px;
      font-weight: 900;
    }

    .task-card.completed .checkmark {
      display: block;
    }

    .task-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      user-select: text;
    }

    .task-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text);
    }

    .task-card.completed .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .tag-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
    }

    .priority-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .priority-high { background-color: var(--priority-high); box-shadow: 0 0 8px rgba(244,63,94,0.6); }
    .priority-med { background-color: var(--priority-med); box-shadow: 0 0 8px rgba(251,191,36,0.6); }
    .priority-low { background-color: var(--priority-low); box-shadow: 0 0 8px rgba(52,211,153,0.6); }

    .date-badge {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .date-badge.overdue {
      color: var(--priority-high);
      font-weight: 700;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      opacity: 0.6;
      transition: all 0.2s;
    }

    .delete-btn:hover {
      opacity: 1;
      color: var(--priority-high);
    }

    /* FLOATING LIQUID GLASS ACTION BUTTON (FAB) */
    .fab-btn {
      position: fixed;
      bottom: 24px;
      right: calc(50% - 240px + 20px);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #030712;
      border: 1px solid rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 700;
      box-shadow: 0 10px 30px var(--primary-glow), inset 0 2px 2px rgba(255, 255, 255, 0.4);
      cursor: pointer;
      z-index: 40;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (max-width: 480px) {
      .fab-btn {
        right: 20px;
      }
    }

    .fab-btn:active {
      transform: scale(0.92);
    }

    /* GLASS BOTTOM SHEET MODAL */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(3, 7, 18, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal-sheet {
      width: 100%;
      max-width: 480px;
      background: var(--glass-card);
      backdrop-filter: blur(32px) saturate(200%);
      -webkit-backdrop-filter: blur(32px) saturate(200%);
      border-top-left-radius: var(--radius-lg);
      border-top-right-radius: var(--radius-lg);
      padding: 24px 20px 36px 20px;
      box-shadow: 0 -10px 50px rgba(0, 0, 0, 0.6), inset 0 1px 1px var(--glass-highlight);
      border: 1px solid var(--glass-border);
      border-bottom: none;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-overlay.active .modal-sheet {
      transform: translateY(0);
    }

    .modal-handle {
      width: 44px;
      height: 5px;
      background: var(--glass-border);
      border-radius: 999px;
      align-self: center;
      margin-bottom: 4px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 19px;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
    }

    .close-modal {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
    }

    .task-input-field {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 15px;
      outline: none;
      box-shadow: inset 0 1px 1px var(--glass-highlight);
      user-select: text;
    }

    .task-input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 14px var(--primary-glow), inset 0 1px 1px var(--glass-highlight);
    }

    .modal-row {
      display: flex;
      gap: 12px;
    }

    .modal-select {
      flex: 1;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #030712;
      border: 1px solid rgba(255, 255, 255, 0.3);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px var(--primary-glow);
      margin-top: 8px;
      transition: transform 0.15s;
    }

    .submit-btn:active {
      transform: scale(0.97);
    }

    /* FOOTER */
    .footer-tools {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--glass-border);
      font-size: 12px;
      color: var(--text-muted);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .footer-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- AMBIENT GLOW ORBS -->
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>
  <div class="ambient-orb orb-3"></div>

  <div class="app-shell">
    <!-- GLASS HEADER -->
    <header>
      <div class="top-bar">
        <div class="app-title-group">
          <h1>✦ Todo Glass</h1>
          <p id="todayDate">Loading date...</p>
        </div>
        <div style="display: flex; gap: 8px;">
          <button class="glass-btn" onclick="toggleTheme()" title="Toggle Dark/Light">◐</button>
          <button class="glass-btn" onclick="exportData()" title="Backup / Export JSON">⤓</button>
        </div>
      </div>

      <!-- PROGRESS GLASS CARD -->
      <div class="glass-progress">
        <div class="progress-info" style="flex: 1;">
          <h2>Daily Progress</h2>
          <p id="taskStats">0 of 0 tasks completed</p>
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="progressBar"></div>
          </div>
        </div>
        <div class="progress-percent" id="progressPercent">0%</div>
      </div>
    </header>

    <!-- SEARCH BAR -->
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="Search tasks..." oninput="renderTasks()">
    </div>

    <!-- FILTER PILLS -->
    <div class="filter-scroll">
      <div class="pill active" data-filter="all" onclick="setFilter('all', this)">All</div>
      <div class="pill" data-filter="active" onclick="setFilter('active', this)">Active</div>
      <div class="pill" data-filter="completed" onclick="setFilter('completed', this)">Completed</div>
      <div class="pill" data-filter="high" onclick="setFilter('high', this)">🔴 Urgent</div>
      <div class="pill" data-filter="work" onclick="setFilter('work', this)">💼 Work</div>
      <div class="pill" data-filter="personal" onclick="setFilter('personal', this)">🏠 Personal</div>
    </div>

    <!-- TASK LIST -->
    <div class="task-list" id="taskList"></div>

    <!-- FOOTER ACTIONS -->
    <div class="footer-tools">
      <span id="footerCount">0 items</span>
      <button class="footer-btn" onclick="clearCompleted()">Clear Completed</button>
    </div>

    <!-- FLOATING LIQUID GLASS BUTTON -->
    <button class="fab-btn" onclick="openModal()">+</button>
  </div>

  <!-- ADD TASK GLASS MODAL -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h3>New Task</h3>
        <button class="close-modal" onclick="closeModal()">✕</button>
      </div>

      <input type="text" class="task-input-field" id="modalTaskInput" placeholder="What needs to be done?" autofocus>

      <div class="modal-row">
        <select class="modal-select" id="modalCategory">
          <option value="General">General</option>
          <option value="Work">Work</option>
          <option value="Personal">Personal</option>
          <option value="Shopping">Shopping</option>
          <option value="Ideas">Ideas</option>
        </select>

        <select class="modal-select" id="modalPriority">
          <option value="low">Low Priority</option>
          <option value="med" selected>Medium Priority</option>
          <option value="high">High Priority 🔴</option>
        </select>
      </div>

      <div class="modal-row">
        <input type="date" class="modal-select" id="modalDueDate">
      </div>

      <button class="submit-btn" onclick="addTaskFromModal()">Add to List</button>
    </div>
  </div>

  <script>
    let tasks = [];
    let currentFilter = 'all';

    function playTapSound(freq = 600) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    function loadTasks() {
      const saved = localStorage.getItem('todo_glass_tasks');
      if (saved) {
        try { tasks = JSON.parse(saved); } catch (e) { tasks = []; }
      } else {
        tasks = [
          { id: '1', title: 'Welcome to Todo Glass for Android ✨', category: 'General', priority: 'high', dueDate: new Date().toISOString().split('T')[0], completed: false },
          { id: '2', title: 'Tap the glowing glass checkbox to complete', category: 'Personal', priority: 'med', dueDate: '', completed: true },
          { id: '3', title: 'Tap the + liquid button to create tasks', category: 'Work', priority: 'low', dueDate: '', completed: false }
        ];
        saveTasks();
      }
    }

    function saveTasks() {
      localStorage.setItem('todo_glass_tasks', JSON.stringify(tasks));
      renderTasks();
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.filter-scroll .pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      renderTasks();
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        playTapSound(task.completed ? 840 : 420);
        saveTasks();
      }
    }

    function deleteTask(id, e) {
      e.stopPropagation();
      playTapSound(280);
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
    }

    function clearCompleted() {
      const completedCount = tasks.filter(t => t.completed).length;
      if (completedCount === 0) return;
      tasks = tasks.filter(t => !t.completed);
      saveTasks();
    }

    function renderTasks() {
      const listEl = document.getElementById('taskList');
      const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
      listEl.innerHTML = '';

      let filtered = tasks.filter(t => {
        if (searchVal && !t.title.toLowerCase().includes(searchVal)) return false;
        if (currentFilter === 'all') return true;
        if (currentFilter === 'active') return !t.completed;
        if (currentFilter === 'completed') return t.completed;
        if (currentFilter === 'high') return t.priority === 'high';
        if (currentFilter === 'work') return t.category.toLowerCase() === 'work';
        if (currentFilter === 'personal') return t.category.toLowerCase() === 'personal';
        return true;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">✦</div>
            <h3>No tasks here</h3>
            <p>Tap + to add a frosted glass task!</p>
          </div>
        `;
      } else {
        filtered.forEach(task => {
          const card = document.createElement('div');
          card.className = `task-card ${task.completed ? 'completed' : ''}`;
          card.onclick = () => toggleTask(task.id);

          const priorityClass = task.priority === 'high' ? 'priority-high' : (task.priority === 'med' ? 'priority-med' : 'priority-low');

          let dateHtml = '';
          if (task.dueDate) {
            const today = new Date().toISOString().split('T')[0];
            const isOverdue = !task.completed && task.dueDate < today;
            const label = task.dueDate === today ? 'Today' : task.dueDate;
            dateHtml = `<span class="date-badge ${isOverdue ? 'overdue' : ''}">📅 ${label}</span>`;
          }

          card.innerHTML = `
            <div class="custom-checkbox">
              <span class="checkmark">✓</span>
            </div>
            <div class="task-content">
              <span class="task-title">${escapeHtml(task.title)}</span>
              <div class="task-meta">
                <span class="priority-dot ${priorityClass}"></span>
                <span class="tag-badge">${task.category}</span>
                ${dateHtml}
              </div>
            </div>
            <div class="task-actions">
              <button class="delete-btn" onclick="deleteTask('${task.id}', event)">✕</button>
            </div>
          `;
          listEl.appendChild(card);
        });
      }

      updateProgress();
    }

    function updateProgress() {
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

      document.getElementById('taskStats').textContent = `${completed} of ${total} tasks completed`;
      document.getElementById('progressBar').style.width = `${percent}%`;
      document.getElementById('progressPercent').textContent = `${percent}%`;
      document.getElementById('footerCount').textContent = `${tasks.filter(t => !t.completed).length} active remaining`;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function openModal() {
      document.getElementById('modalOverlay').classList.add('active');
      document.getElementById('modalTaskInput').value = '';
      document.getElementById('modalDueDate').value = '';
      document.getElementById('modalTaskInput').focus();
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function closeModalOnOverlay(e) {
      if (e.target.id === 'modalOverlay') closeModal();
    }

    function addTaskFromModal() {
      const input = document.getElementById('modalTaskInput');
      const title = input.value.trim();
      if (!title) return;

      const category = document.getElementById('modalCategory').value;
      const priority = document.getElementById('modalPriority').value;
      const dueDate = document.getElementById('modalDueDate').value;

      tasks.unshift({
        id: Date.now().toString(),
        title,
        category,
        priority,
        dueDate,
        completed: false
      });

      playTapSound(520);
      saveTasks();
      closeModal();
    }

    document.getElementById('modalTaskInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTaskFromModal();
    });

    function toggleTheme() {
      document.body.classList.toggle('light-theme');
      const isLight = document.body.classList.contains('light-theme');
      localStorage.setItem('todo_glass_theme', isLight ? 'light' : 'dark');
    }

    function initTheme() {
      const saved = localStorage.getItem('todo_glass_theme');
      if (saved === 'light') document.body.classList.add('light-theme');
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tasks, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `todo_glass_backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function renderDate() {
      const options = { weekday: 'long', month: 'short', day: 'numeric' };
      document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-US', options);
    }

    initTheme();
    renderDate();
    loadTasks();
  </script>
</body>
</html>
