<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Todo Master • Android</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f17;
      --surface: #141b27;
      --surface-card: #1c2536;
      --surface-hover: #263248;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.25);
      --accent: #818cf8;
      --priority-high: #f43f5e;
      --priority-med: #fbbf24;
      --priority-low: #34d399;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .light-theme {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-card: #f8fafc;
      --surface-hover: #e2e8f0;
      --border: rgba(0, 0, 0, 0.08);
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-glow: rgba(2, 132, 199, 0.2);
      --accent: #6366f1;
      --shadow: 0 10px 25px -10px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      transition: background-color 0.3s ease;
      overflow-x: hidden;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--surface);
      box-shadow: 0 0 50px rgba(0,0,0,0.3);
      padding-bottom: 90px;
    }

    /* HEADER */
    header {
      padding: 24px 20px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(12px);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-title-group h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-title-group p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
      font-weight: 500;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface-card);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:active {
      transform: scale(0.92);
      background: var(--surface-hover);
    }

    /* PROGRESS CARD */
    .progress-card {
      background: linear-gradient(135deg, var(--surface-card) 0%, var(--surface-hover) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
    }

    .progress-info h2 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .progress-info p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
      margin-top: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 999px;
      width: 0%;
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .progress-percent {
      font-family: 'Space Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
      margin-left: 16px;
    }

    /* SEARCH & FILTER */
    .search-box {
      margin: 16px 20px 8px 20px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    /* FILTER PILLS */
    .filter-scroll {
      display: flex;
      gap: 8px;
      padding: 8px 20px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filter-scroll::-webkit-scrollbar {
      display: none;
    }

    .pill {
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--surface-card);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .pill.active {
      background: var(--primary);
      color: #0b0f17;
      border-color: var(--primary);
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    /* TASK LIST */
    .task-list {
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--text-muted);
      text-align: center;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.6;
    }

    .empty-state h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .empty-state p {
      font-size: 13px;
    }

    /* TASK ITEM */
    .task-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .task-card:active {
      transform: scale(0.98);
    }

    .task-card.completed {
      opacity: 0.55;
      background: var(--surface);
    }

    .custom-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
      transition: all 0.2s ease;
    }

    .custom-checkbox:hover {
      border-color: var(--primary);
    }

    .task-card.completed .custom-checkbox {
      background: var(--primary);
      border-color: var(--primary);
    }

    .checkmark {
      display: none;
      color: #0b0f17;
      font-size: 13px;
      font-weight: 900;
    }

    .task-card.completed .checkmark {
      display: block;
    }

    .task-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      user-select: text;
    }

    .task-title {
      font-size: 14.5px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text);
      transition: color 0.2s;
    }

    .task-card.completed .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .tag-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(255,255,255,0.06);
      color: var(--text-muted);
    }

    .priority-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .priority-high { background-color: var(--priority-high); }
    .priority-med { background-color: var(--priority-med); }
    .priority-low { background-color: var(--priority-low); }

    .date-badge {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .date-badge.overdue {
      color: var(--priority-high);
      font-weight: 700;
    }

    .task-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      opacity: 0.6;
      transition: all 0.2s;
    }

    .delete-btn:hover {
      opacity: 1;
      color: var(--priority-high);
    }

    /* FLOATING ACTION BUTTON (FAB) */
    .fab-btn {
      position: fixed;
      bottom: 24px;
      right: calc(50% - 240px + 20px);
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #0b0f17;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      box-shadow: 0 10px 25px var(--primary-glow);
      cursor: pointer;
      z-index: 30;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (max-width: 480px) {
      .fab-btn {
        right: 20px;
      }
    }

    .fab-btn:active {
      transform: scale(0.9);
    }

    /* MODAL BOTTOM SHEET */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal-sheet {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border-top-left-radius: var(--radius-lg);
      border-top-right-radius: var(--radius-lg);
      padding: 24px 20px 32px 20px;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      border-bottom: none;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-overlay.active .modal-sheet {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 18px;
      font-weight: 700;
    }

    .close-modal {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
    }

    .task-input-field {
      width: 100%;
      padding: 14px 16px;
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 15px;
      outline: none;
      user-select: text;
    }

    .task-input-field:focus {
      border-color: var(--primary);
    }

    .modal-row {
      display: flex;
      gap: 12px;
    }

    .modal-select {
      flex: 1;
      padding: 10px 14px;
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #0b0f17;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.15s;
    }

    .submit-btn:active {
      transform: scale(0.97);
    }

    /* FOOTER STATS */
    .footer-tools {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
    }

    .footer-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <!-- HEADER -->
    <header>
      <div class="top-bar">
        <div class="app-title-group">
          <h1>✓ Todo Master</h1>
          <p id="todayDate">Loading date...</p>
        </div>
        <div style="display: flex; gap: 8px;">
          <button class="icon-btn" onclick="toggleTheme()" title="Toggle Dark/Light">◐</button>
          <button class="icon-btn" onclick="exportData()" title="Backup / Export JSON">⤓</button>
        </div>
      </div>

      <!-- PROGRESS SUMMARY -->
      <div class="progress-card">
        <div class="progress-info" style="flex: 1;">
          <h2>Daily Completion</h2>
          <p id="taskStats">0 of 0 tasks completed</p>
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="progressBar"></div>
          </div>
        </div>
        <div class="progress-percent" id="progressPercent">0%</div>
      </div>
    </header>

    <!-- SEARCH BAR -->
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="Search tasks..." oninput="renderTasks()">
    </div>

    <!-- FILTER PILLS -->
    <div class="filter-scroll">
      <div class="pill active" data-filter="all" onclick="setFilter('all', this)">All</div>
      <div class="pill" data-filter="active" onclick="setFilter('active', this)">Active</div>
      <div class="pill" data-filter="completed" onclick="setFilter('completed', this)">Completed</div>
      <div class="pill" data-filter="high" onclick="setFilter('high', this)">🔴 Urgent</div>
      <div class="pill" data-filter="work" onclick="setFilter('work', this)">💼 Work</div>
      <div class="pill" data-filter="personal" onclick="setFilter('personal', this)">🏠 Personal</div>
    </div>

    <!-- TASK LIST -->
    <div class="task-list" id="taskList">
      <!-- Tasks rendered dynamically -->
    </div>

    <!-- FOOTER ACTIONS -->
    <div class="footer-tools">
      <span id="footerCount">0 items</span>
      <button class="footer-btn" onclick="clearCompleted()">Clear Completed</button>
    </div>

    <!-- FAB ADD BUTTON -->
    <button class="fab-btn" onclick="openModal()">+</button>
  </div>

  <!-- ADD TASK MODAL (BOTTOM SHEET) -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3>New Task</h3>
        <button class="close-modal" onclick="closeModal()">✕</button>
      </div>

      <input type="text" class="task-input-field" id="modalTaskInput" placeholder="What needs to be done?" autofocus>

      <div class="modal-row">
        <select class="modal-select" id="modalCategory">
          <option value="General">General</option>
          <option value="Work">Work</option>
          <option value="Personal">Personal</option>
          <option value="Shopping">Shopping</option>
          <option value="Ideas">Ideas</option>
        </select>

        <select class="modal-select" id="modalPriority">
          <option value="low">Low Priority</option>
          <option value="med" selected>Medium Priority</option>
          <option value="high">High Priority 🔴</option>
        </select>
      </div>

      <div class="modal-row">
        <input type="date" class="modal-select" id="modalDueDate">
      </div>

      <button class="submit-btn" onclick="addTaskFromModal()">Add to List</button>
    </div>
  </div>

  <script>
    // State
    let tasks = [];
    let currentFilter = 'all';

    // Synthetic Sound via Web Audio API (Haptic/Click sound)
    function playTapSound(freq = 600) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    // Storage
    function loadTasks() {
      const saved = localStorage.getItem('todo_master_tasks');
      if (saved) {
        try { tasks = JSON.parse(saved); } catch (e) { tasks = []; }
      } else {
        // Welcome sample tasks
        tasks = [
          { id: '1', title: 'Welcome to Todo Master for Android 🚀', category: 'General', priority: 'high', dueDate: new Date().toISOString().split('T')[0], completed: false },
          { id: '2', title: 'Tap the checkbox to complete a task', category: 'Personal', priority: 'med', dueDate: '', completed: true },
          { id: '3', title: 'Tap the + button to add your own tasks', category: 'Work', priority: 'low', dueDate: '', completed: false }
        ];
        saveTasks();
      }
    }

    function saveTasks() {
      localStorage.setItem('todo_master_tasks', JSON.stringify(tasks));
      renderTasks();
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.filter-scroll .pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      renderTasks();
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        playTapSound(task.completed ? 800 : 400);
        saveTasks();
      }
    }

    function deleteTask(id, e) {
      e.stopPropagation();
      playTapSound(300);
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
    }

    function clearCompleted() {
      const completedCount = tasks.filter(t => t.completed).length;
      if (completedCount === 0) return;
      tasks = tasks.filter(t => !t.completed);
      saveTasks();
    }

    function renderTasks() {
      const listEl = document.getElementById('taskList');
      const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
      listEl.innerHTML = '';

      let filtered = tasks.filter(t => {
        // Search filter
        if (searchVal && !t.title.toLowerCase().includes(searchVal)) return false;

        // Tab filter
        if (currentFilter === 'all') return true;
        if (currentFilter === 'active') return !t.completed;
        if (currentFilter === 'completed') return t.completed;
        if (currentFilter === 'high') return t.priority === 'high';
        if (currentFilter === 'work') return t.category.toLowerCase() === 'work';
        if (currentFilter === 'personal') return t.category.toLowerCase() === 'personal';
        return true;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📝</div>
            <h3>No tasks found</h3>
            <p>Tap + below to create a new task!</p>
          </div>
        `;
      } else {
        filtered.forEach(task => {
          const card = document.createElement('div');
          card.className = `task-card ${task.completed ? 'completed' : ''}`;
          card.onclick = () => toggleTask(task.id);

          const priorityClass = task.priority === 'high' ? 'priority-high' : (task.priority === 'med' ? 'priority-med' : 'priority-low');

          // Date calculation
          let dateHtml = '';
          if (task.dueDate) {
            const today = new Date().toISOString().split('T')[0];
            const isOverdue = !task.completed && task.dueDate < today;
            const label = task.dueDate === today ? 'Today' : task.dueDate;
            dateHtml = `<span class="date-badge ${isOverdue ? 'overdue' : ''}">📅 ${label}</span>`;
          }

          card.innerHTML = `
            <div class="custom-checkbox">
              <span class="checkmark">✓</span>
            </div>
            <div class="task-content">
              <span class="task-title">${escapeHtml(task.title)}</span>
              <div class="task-meta">
                <span class="priority-dot ${priorityClass}"></span>
                <span class="tag-badge">${task.category}</span>
                ${dateHtml}
              </div>
            </div>
            <div class="task-actions">
              <button class="delete-btn" onclick="deleteTask('${task.id}', event)">✕</button>
            </div>
          `;
          listEl.appendChild(card);
        });
      }

      updateProgress();
    }

    function updateProgress() {
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

      document.getElementById('taskStats').textContent = `${completed} of ${total} tasks completed`;
      document.getElementById('progressBar').style.width = `${percent}%`;
      document.getElementById('progressPercent').textContent = `${percent}%`;
      document.getElementById('footerCount').textContent = `${tasks.filter(t => !t.completed).length} active remaining`;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Modal
    function openModal() {
      document.getElementById('modalOverlay').classList.add('active');
      document.getElementById('modalTaskInput').value = '';
      document.getElementById('modalDueDate').value = '';
      document.getElementById('modalTaskInput').focus();
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function closeModalOnOverlay(e) {
      if (e.target.id === 'modalOverlay') closeModal();
    }

    function addTaskFromModal() {
      const input = document.getElementById('modalTaskInput');
      const title = input.value.trim();
      if (!title) return;

      const category = document.getElementById('modalCategory').value;
      const priority = document.getElementById('modalPriority').value;
      const dueDate = document.getElementById('modalDueDate').value;

      tasks.unshift({
        id: Date.now().toString(),
        title,
        category,
        priority,
        dueDate,
        completed: false
      });

      playTapSound(520);
      saveTasks();
      closeModal();
    }

    // Enter key inside modal
    document.getElementById('modalTaskInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTaskFromModal();
    });

    // Theme toggle
    function toggleTheme() {
      document.body.classList.toggle('light-theme');
      const isLight = document.body.classList.contains('light-theme');
      localStorage.setItem('todo_theme', isLight ? 'light' : 'dark');
    }

    function initTheme() {
      const saved = localStorage.getItem('todo_theme');
      if (saved === 'light') document.body.classList.add('light-theme');
    }

    // Export Data
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tasks, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `todo_backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // Format current date
    function renderDate() {
      const options = { weekday: 'long', month: 'short', day: 'numeric' };
      document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-US', options);
    }

    // Init
    initTheme();
    renderDate();
    loadTasks();
  </script>
</body>
</html>
